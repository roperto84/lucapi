[package]
name = "lucapi"
version = "1.10.0"
edition = "2024"

[dependencies]
arboard = "3.7"
eframe = "0.31.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "gzip", "brotli", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }
rustls-platform-verifier = "0.7"
rfd = "0.15"
serde_yaml = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.20"
